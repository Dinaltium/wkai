[package]
name = "wkai-instructor"
version = "0.1.52"
description = "WKAI Instructor Desktop App"
authors = ["WKAI Team"]
edition = "2021"

[lib]
name = "wkai_instructor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "wkai-instructor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.11.0", features = [
  "tray-icon",
  "image-png",
] }

# Tauri plugins
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.5.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client (for calling Groq APIs)
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Screen capture
image = { version = "0.25", features = ["jpeg", "png"] }
# The `image` crate's JPEG encoder has no SIMD path and was the hard ceiling on
# capture framerate: 36ms for a typical 1080p desktop frame (~28fps), and ~95ms
# on dense content like a detailed wallpaper (~10fps), which is where the live
# stream visibly fell apart. This one encodes the same frame in 17ms, and
# slightly smaller. Kept alongside `image`, which still does capture-side
# resizing and PNG.
jpeg-encoder = { version = "0.6", features = ["simd"] }

# Audio capture
cpal = "0.15"

# File watching (for auto-detect shareable files)
notify = "6.0"

# Base64 (for encoding screenshots before sending)
base64 = "0.22"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# UUID for room/session IDs
uuid = { version = "1.0", features = ["v4"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Channel for threading
flume = "0.11"
tauri-plugin-updater = "2.10.1"
xcap = "0.9.4"

[profile.dev]
incremental = true
debug = true
# The dev profile defaults to opt-level 0, which makes the pure-Rust JPEG
# encoder in the capture loop 400-600ms per native-res frame (measured) — a
# ~1.5fps hard ceiling regardless of anything downstream. opt-level 3 here
# keeps incremental rebuilds/hot-reload but makes the hot capture/encode path
# run at real speed.
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = false

# WebView2 permission interception, so device consent stays in the app's own
# dialog instead of a floating browser bar. Versions match what wry already
# resolves, so this pulls in nothing new.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }
