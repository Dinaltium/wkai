name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # With more than one platform in the build matrix, each tauri-action run
  # races to create the same release and the loser fails with a 422.
  # Create it once here so the builders only ever attach assets.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "WKAI $TAG" --notes "Automated WKAI desktop app release"
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: "--bundles appimage,deb"
          # - platform: macos-latest
          #   args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./wkai/src-tauri -> target"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Install deps
        run: npm install
        working-directory: wkai

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No updater signing key. Set the TAURI_SIGNING_PRIVATE_KEY repository secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one)."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: wkai
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: WKAI ${{ github.ref_name }}
          releaseBody: "Automated WKAI desktop app release"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Verify updater signature against the shipped pubkey
        shell: bash
        run: node ./scripts/verify-updater-signature.mjs
        working-directory: wkai