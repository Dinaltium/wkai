name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # - platform: ubuntu-22.04
          #   args: "--bundles appimage,deb"
          # - platform: macos-latest
          #   args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./wkai/src-tauri -> target"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf

      - name: Install deps
        run: npm install
        working-directory: wkai

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No updater signing key. Set the TAURI_SIGNING_PRIVATE_KEY repository secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one)."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: wkai
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: WKAI ${{ github.ref_name }}
          releaseBody: "Automated WKAI desktop app release"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Verify updater signature against the shipped pubkey
        shell: bash
        run: node ./scripts/verify-updater-signature.mjs
        working-directory: wkai