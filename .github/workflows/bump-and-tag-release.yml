name: Bump And Tag Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  RELEASE_BRANCH: release/main

jobs:
  bump-and-tag:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install deps
        run: npm install
        working-directory: wkai

      - name: Resolve bump type
        id: bump
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve base version from newest release tag
        id: base
        shell: bash
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v$(node -p "require('./wkai/package.json').version")"
            echo "No v* tags found, falling back to package.json version $LATEST"
          fi
          echo "Newest release tag: $LATEST"
          echo "value=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Bump app version
        run: node ./scripts/bump-version.mjs "${{ steps.bump.outputs.value }}" --from "${{ steps.base.outputs.value }}"
        working-directory: wkai

      - name: Read bumped version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./wkai/package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version files
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wkai/package.json wkai/src-tauri/tauri.conf.json wkai/src-tauri/Cargo.toml wkai/src-tauri/Cargo.lock wkai/package-lock.json
          git commit -m "chore(release): bump app version to v${{ steps.version.outputs.value }} [skip release]"

      - name: Create and push tag
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists - refusing to overwrite an existing release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git tag "$TAG"
          git push origin HEAD:refs/heads/${RELEASE_BRANCH} --force
          git push origin "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  build-release:
    needs: bump-and-tag
    if: needs.bump-and-tag.outputs.tagged == 'true'
    env:
      HAS_TAURI_SIGNING: ${{ secrets.TAURI_PRIVATE_KEY != '' && secrets.TAURI_KEY_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # - platform: ubuntu-22.04
          #   args: "--bundles appimage,deb"
          # - platform: macos-latest
          #   args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./wkai/src-tauri -> target"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf

      - name: Install deps
        run: npm install
        working-directory: wkai

      - name: Build Tauri app (signed)
        if: env.HAS_TAURI_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: wkai
          args: ${{ matrix.args }}
          tagName: v${{ needs.bump-and-tag.outputs.version }}
          releaseName: WKAI v${{ needs.bump-and-tag.outputs.version }}
          releaseBody: "Automated WKAI desktop app release"
          releaseDraft: false
          prerelease: false

      - name: Build Tauri app (unsigned)
        if: env.HAS_TAURI_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: wkai
          args: ${{ matrix.args }}
          tagName: v${{ needs.bump-and-tag.outputs.version }}
          releaseName: WKAI v${{ needs.bump-and-tag.outputs.version }}
          releaseBody: "Automated WKAI desktop app release (unsigned)"
          releaseDraft: false
          prerelease: false
