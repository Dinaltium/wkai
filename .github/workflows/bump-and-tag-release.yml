name: Bump And Tag Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  RELEASE_BRANCH: release/main

jobs:
  bump-and-tag:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install deps
        run: npm install
        working-directory: wkai

      - name: Resolve bump type
        id: bump
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve base version from newest release tag
        id: base
        shell: bash
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            LATEST="v$(node -p "require('./wkai/package.json').version")"
            echo "No v* tags found, falling back to package.json version $LATEST"
          fi
          echo "Newest release tag: $LATEST"
          echo "value=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Bump app version
        run: node ./scripts/bump-version.mjs "${{ steps.bump.outputs.value }}" --from "${{ steps.base.outputs.value }}"
        working-directory: wkai

      - name: Read bumped version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./wkai/package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version files
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wkai/package.json wkai/src-tauri/tauri.conf.json wkai/src-tauri/Cargo.toml wkai/src-tauri/Cargo.lock wkai/package-lock.json
          git commit -m "chore(release): bump app version to v${{ steps.version.outputs.value }} [skip release]"

      - name: Create and push tag
        id: tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists - refusing to overwrite an existing release."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git tag "$TAG"
          git push origin HEAD:refs/heads/${RELEASE_BRANCH} --force
          git push origin "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      # With more than one platform in the build matrix, each tauri-action run
      # races to create the same release and the loser fails with a 422.
      # Create it once here so the builders only ever attach assets.
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --title "WKAI $TAG" --notes "Automated WKAI desktop app release"
          fi

  build-release:
    needs: bump-and-tag
    if: needs.bump-and-tag.outputs.tagged == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: "--bundles appimage,deb"
          # - platform: macos-latest
          #   args: "--bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./wkai/src-tauri -> target"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: wkai/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('wkai/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Install deps
        run: npm install
        working-directory: wkai

      # An unsigned build produces a release that installed apps can never
      # update to, and it does so quietly. Fail here instead, so a missing key
      # is a broken pipeline rather than a release nobody can install.
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No updater signing key. Set the TAURI_SIGNING_PRIVATE_KEY repository secret (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one)."
            exit 1
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri v2 names. The v1 names (TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD)
          # are ignored by the v2 CLI, which is why releases shipped without a
          # latest.json for months.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: wkai
          args: ${{ matrix.args }}
          tagName: v${{ needs.bump-and-tag.outputs.version }}
          releaseName: WKAI v${{ needs.bump-and-tag.outputs.version }}
          releaseBody: "Automated WKAI desktop app release"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # The signature is only useful if it verifies against the pubkey compiled
      # into the app. A key rotation that forgets tauri.conf.json would ship a
      # release every client rejects, so prove it here.
      - name: Verify updater signature against the shipped pubkey
        shell: bash
        run: node ./scripts/verify-updater-signature.mjs
        working-directory: wkai

      - name: Verify release carries updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.bump-and-tag.outputs.version }}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$NAMES"
          echo "$NAMES" | grep -qx 'latest.json' || {
            echo "::error::Release $TAG has no latest.json - in-app updates would silently do nothing."
            exit 1
          }
          # Each platform's job checks only its own bundle: the matrix runs in
          # parallel, so the other platform's assets may not be uploaded yet.
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "$NAMES" | grep -q '\-setup\.exe\.sig$' || {
              echo "::error::Release $TAG has no signed NSIS installer - the Windows updater has nothing to install."
              exit 1
            }
          else
            echo "$NAMES" | grep -q '\.AppImage\.sig$' || {
              echo "::error::Release $TAG has no signed AppImage - the Linux updater has nothing to install."
              exit 1
            }
          fi

  # GitHub's release CDN is unreachable from some networks while the API is
  # fine. Mirror the installers to Google Drive and record the links in the
  # release notes, where the download page can read them via the API.
  # Skips itself when the Drive secrets are not configured.
  mirror:
    needs: [bump-and-tag, build-release]
    # always(): mirror whatever did get built, even if one platform failed.
    if: always() && needs.bump-and-tag.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check for mirror credentials
        id: creds
        shell: bash
        env:
          SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -n "$SA" ] && [ -n "$FOLDER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GDRIVE_SERVICE_ACCOUNT_JSON / GDRIVE_FOLDER_ID not set - skipping mirror."
          fi

      - name: Checkout
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}

      - name: Setup Node
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        if: steps.creds.outputs.enabled == 'true'
        run: npm install
        working-directory: wkai

      - name: Download release assets
        if: steps.creds.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.bump-and-tag.outputs.version }}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          ls -la release-assets

      - name: Upload to Google Drive
        if: steps.creds.outputs.enabled == 'true'
        shell: bash
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node wkai/scripts/upload-mirror.mjs release-assets > mirrors.json && cat mirrors.json

      - name: Write mirror links into the release notes
        if: steps.creds.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.bump-and-tag.outputs.version }}"
          CURRENT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          # Drop any previous mirrors block, then append the fresh one.
          BASE=$(printf '%s' "$CURRENT" | sed '/<!-- mirrors -->/,$d')
          {
            printf '%s\n\n' "$BASE"
            echo '<!-- mirrors -->'
            echo '### Mirror (Google Drive)'
            echo 'If the GitHub download does not start, use these:'
            echo
            node -e '
              const m = JSON.parse(require("fs").readFileSync("mirrors.json","utf8"));
              for (const [n,u] of Object.entries(m)) console.log(`- [${n}](${u})`);
            '
            echo
            echo '```json mirrors'
            cat mirrors.json
            echo '```'
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
