name: Keep Alive

on:
  schedule:
    # Multiple irregular intervals to avoid simple heartbeat detection
    - cron: '*/11 * * * *'
    - cron: '*/13 * * * *'
    - cron: '*/17 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Add a random sleep between 1 and 60 seconds to make it less predictable
          SLEEP_TIME=$(( ( RANDOM % 60 ) + 1 ))
          echo "Sleeping for $SLEEP_TIME seconds..."
          sleep $SLEEP_TIME
          
          # The Render backend URL
          URL="https://wkai.onrender.com/health"
          echo "Pinging $URL"
          curl -f -s $URL || echo "Ping failed, but that's okay (backend might be starting up)"
