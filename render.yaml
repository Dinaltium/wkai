services:
  - type: web
    name: wkai-backend
    runtime: node
    rootDir: wkai-backend
    plan: starter
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    # Render automatically injects RENDER_EXTERNAL_URL at runtime.
    # KeepAlive uses that value for self-ping in production.
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      # Public address of the student SPA. Without it the invite dialog falls
      # back to the container's own private IP, which no student can reach.
      - key: STUDENT_URL
        value: https://wkai.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STUDENT_JOIN_TOKEN_SECRET
        sync: false
